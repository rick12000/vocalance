# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    # RTD's asdf images do not provide the exact patch (3.13.9) that the
    # project requires for reproducible builds. We pin to the 3.13 minor
    # series here and pass --ignore-requires-python below so docs can build
    # without weakening the application's strict pin in pyproject.toml.
    python: "3.13"
  jobs:
    post_install:
      - pip install --ignore-requires-python -e ".[docs]"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub
