[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalance"
version = "0.1.0"
description = "Voice command assistant"
readme = "README.md"
authors = [
    {name = "Riccardo Doyle", email = "r.doyle.edu@gmail.com"}
]
requires-python = "==3.13.9"
classifiers = [
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "vosk==0.3.45",
    "sounddevice==0.5.3",
    "librosa==0.11.0",
    "soundfile==0.13.1",
    "numpy==2.3.5",
    "scipy==1.16.3",
    "sherpa-onnx==1.13.4",
    "tensorflow-cpu==2.20.0",
    "pyside6==6.10.1",
    "pillow==12.2.0",
    "pyautogui==0.9.54",
    "pyperclip==1.11.0",
    "pydantic==2.12.4",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "keras==3.14.1",
    "protobuf==7.35.1",
    "urllib3==2.7.0",
    "msgpack==1.2.1"
]

[project.urls]
Homepage = "https://github.com/rick12000/vocalance"

[project.optional-dependencies]
llm = [
    "llama-cpp-python==0.3.20",
    "huggingface-hub==1.1.5",
]
dev = [
    "starlette==1.3.1",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "pre-commit>=3.4.0",
    "black>=26.3.1",
    "flake8>=7.0.0",
    "sphinx>=8.1.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=3.0.0",
    "sphinx-autobuild>=2021.3.14",
    "sphinxcontrib-mermaid>=0.9.2",
    "wheel>=0.46.2"
]
docs = [
    "sphinx>=8.1.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=3.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=0.9.2",
    "linkify-it-py>=2.0.0",
    "sphinx-autobuild>=2024.2.4"
]

[tool.setuptools]
packages = {find = {exclude = ["tests*", "examples*", "docs*", "build*", "cache*", "dist*", "*.egg-info*", "NOTICES*"]}}
include-package-data = true

[tool.setuptools.package-data]
"*" = ["assets/**/*", "app/assets/**/*"]
"vocalance.app.ui.style" = ["qss/*.qss"]

[tool.pytest.ini_options]
markers = [
    "memory: Memory leak detection tests",
    "slow: Slow tests (models, heavy operations)",
    "stress: Stress tests under high load",
    "integration: Integration tests",
    "unit: Unit tests"
]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--disable-warnings"
]
