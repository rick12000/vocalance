name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]  # All branches
  pull_request:
    branches: [ '**' ]  # All branches

env:
  PYTHON_VERSION: "3.13.9"

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install dependencies
      run: uv pip install --system pre-commit

    - name: Cache pre-commit
      uses: actions/cache@v3
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: pre-commit run --all-files

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy filesystem scan (SARIF report)
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0 — verified safe post-2026-03-19 incident
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif
        scanners: vuln,secret,misconfig
        exit-code: '0'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Trivy SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: trivy-results.sarif
        category: trivy-fs

    - name: Fail on CRITICAL or HIGH severity findings
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0 — verified safe post-2026-03-19 incident
      with:
        scan-type: fs
        scan-ref: .
        format: table
        scanners: vuln,secret,misconfig
        severity: CRITICAL,HIGH
        exit-code: '1'
        github-token: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install application with dev dependencies
      run: uv pip install --system -e ".[dev]"

    - name: Run unit tests
      run: pytest -m "not slow and not integration and not memory and not stress"

  verify-logging-default-off:
    name: Verify enable_logs defaults to false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Assert LoggingConfigModel.enable_logs is default False
        run: python3 scripts/ci/assert_logging_disabled_by_default.py
